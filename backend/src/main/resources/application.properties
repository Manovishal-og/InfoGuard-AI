# Server
server.port=8080
spring.application.name=verifier

# PostgreSQL Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/verifier_db
spring.datasource.username=postgres
spring.datasource.password=mypass
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# API Keys
app.apify.token=${APIFY_API_KEY}
app.groq.api-key=${GROQ_API_KEY}
app.tavily.api-key=${TAVILY_API_KEY}
app.groq.model=qwen/qwen3.8-27b

# File System
app.media.temp-dir=/tmp/verifier_media
